name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scénario k6 à exécuter"
        type: choice
        default: load
        options: [smoke, load, stress]
      vus:
        description: "Nombre de VUs (load/stress)"
        type: string
        default: "10"
      duration:
        description: "Durée du palier de charge (load)"
        type: string
        default: "1m"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: MaDemo

jobs:
  build:
    name: Build & tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compiler et tester
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: MaDemo/target/surefire-reports/
          if-no-files-found: ignore

      - name: Publier le jar
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: MaDemo/target/MaDemo-*.jar
          retention-days: 1

  k6:
    name: Tests de performance k6
    needs: build
    runs-on: ubuntu-latest

    services:
      db:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: monitoring_nebula
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      BASE_URL: http://localhost:8080
      K6_OUT_DIR: results
      VUS: ${{ inputs.vus || '10' }}
      DURATION: ${{ inputs.duration || '1m' }}

    steps:
      - uses: actions/checkout@v4

      - name: Installer JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Récupérer le jar
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: MaDemo/target

      - name: Démarrer l'application
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/monitoring_nebula?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          # Le rate limiter plafonne à 100 req/min par IP : désactivé ici
          # pour mesurer l'application et non le filtre.
          RATELIMIT_ENABLED: "false"
          # Les logs SQL de debug fausseraient complètement les latences.
          SPRING_JPA_SHOW_SQL: "false"
          LOGGING_LEVEL_ORG_HIBERNATE_SQL: WARN
          LOGGING_LEVEL_ORG_HIBERNATE_TYPE_DESCRIPTOR_SQL_BASICBINDER: WARN
        run: |
          nohup java -jar target/MaDemo-*.jar > app.log 2>&1 &
          echo $! > app.pid

      - name: Attendre que l'application soit UP
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL/actuator/health" | grep -q '"status":"UP"'; then
              echo "Application prête après ${i} tentative(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::L'application n'a pas démarré dans le temps imparti."
          tail -n 200 app.log
          exit 1

      - name: Installer k6
        uses: grafana/setup-k6-action@v1

      - name: Exécuter les scénarios k6
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) SCENARIOS="${{ inputs.scenario }}" ;;
            pull_request)      SCENARIOS="smoke" ;;
            *)                 SCENARIOS="smoke load" ;;
          esac

          mkdir -p "$K6_OUT_DIR"
          status=0
          for scenario in $SCENARIOS; do
            echo "::group::k6 run $scenario"
            k6 run "k6/${scenario}.js" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Ajouter le résumé au job
        if: always()
        run: |
          shopt -s nullglob
          for file in "$K6_OUT_DIR"/*-summary.md; do
            cat "$file" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Archiver les résultats et les logs applicatifs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-${{ github.run_number }}
          path: |
            MaDemo/results/
            MaDemo/app.log
          if-no-files-found: warn

      - name: Arrêter l'application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill "$(cat app.pid)" 2>/dev/null || true
          fi
